version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo-sdk:
        patterns:
          - expo
          - expo-*
          - '@expo/*'
          - '@react-native/*'
          - react-native
          - react-native-*
          - jest-expo
        update-types:
          - patch
          - minor
      npm-patch-minor:
        patterns:
          - "*"
        exclude-patterns:
          - typescript
          - eslint
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
