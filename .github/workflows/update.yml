name: Verify and Build Expo App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

defaults:
  run:
    working-directory: app

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - uses: expo/expo-github-action@v8
        if: github.event_name == 'push'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android app
        if: github.event_name == 'push'
        env:
          BUILD_PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'preview' }}
        run: eas build --platform android --profile "$BUILD_PROFILE" --non-interactive

      - name: Publish Expo update
        if: github.event_name == 'push'
        env:
          CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'preview' }}
          ENVIRONMENT: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'preview' }}
          MSG: ${{ github.event.head_commit.message || github.ref_name }}
        run: eas update --channel "$CHANNEL" --environment "$ENVIRONMENT" --platform all --non-interactive --message "$MSG"
