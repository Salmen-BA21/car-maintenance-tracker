version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      expo-sdk:
        patterns:
          - expo
          - expo-*
          - '@expo/*'
          - '@react-native/*'
          - react-native
          - react-native-*
          - jest-expo
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
